name: cc-setup-agent

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: setup
      POSTGRES_PASSWORD: setup
      POSTGRES_DB: setup_agent
    ports:
      - '${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U setup -d setup_agent']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
