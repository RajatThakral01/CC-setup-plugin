name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: setup
          POSTGRES_PASSWORD: setup
          POSTGRES_DB: setup_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U setup -d setup_agent"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://setup:setup@localhost:5432/setup_agent
      TEST_DATABASE_URL: postgres://setup:setup@localhost:5432/setup_agent
      # Real-Docker sandbox tests (fixture MCP servers only; no package installs).
      SANDBOX_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:models
      - run: pnpm db:health
      - run: pnpm test

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks CLI in its pinned container (gitleaks-action fails on first pushes with no base commit).
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          git /repo --no-banner --redact
